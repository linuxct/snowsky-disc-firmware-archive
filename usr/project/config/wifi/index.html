<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>www.fiio.com</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin-top: 50px;
        }

        .father_window {
            width: 300px;
            height: 400px;
            text-align: center;

            background-color: #a4e5ee;
        }

        .head_title {
            width: 300px;
            height: 50px;
            padding: 10px;

            color: white;
        }

        .sidemenu {
            width: 300px;
            height: 50px;
            margin-top: 20px;
        }


        .sidemenu ul {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;

        }

        .sidemenu li a {
            margin: 10px;
            display: block;
            padding: 10px;
            background-color: #eee;
            text-decoration: none;

            border-radius: 10px;

        .sidemenu li a:hover {

        <div class="column sidemenu">
