[global]
strict init = true
reload conf period = 30s

buffer min = 1024
buffer max = 2MB

rotate lock file = /tmp/zlog.lock
#rotate lock file = self

file perms = 600
fsync period = 1K

[levels]
TRACE = 30
CRIT = 130, LOG_CRIT

[formats]
#my = "[%d(%F %T.%ms)] [%-6V] %F>: FUN: %U, LINE: %L, %m"
my = "[%d(%F %T.)%ms] [%-6V] %f: %L> %m"


[rules]
#my_cat.!DEBUG		>stdout; my
#*.*		        >stdout; my
# my_cat.=DEBUG		>stdout; my
my_cat.=INFO		>stdout; my
my_cat.=NOTICE		>stdout; my
my_cat.=WARN		>stdout; my
my_cat.=ERROR		>stdout; my
my_cat.=FATAl		>stdout; my
my_cat.!DEBUG       "/usr/data/fiio/log/fiio_ui.log", 1MB * 3 ~ "/usr/data/fiio/log/fiio_ui.log.#r"; my


